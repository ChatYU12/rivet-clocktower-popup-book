<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>小铆钉的钟楼之旅</title>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
/* VOICE: 机械复古童话，温暖、厚重、有手工金属感
   IDEA: 一本摊在胡桃木工作台上的皮面立体书，每页立起一组冲压金属零件
   PICTURE: three.js 金属片场景，带环境反射，展开时立起、翻页时折平

:root{color-scheme:dark;--bg:#22150c;--card:linear-gradient(160deg,#3d2a18,#21150c);--ink:#f3e3c3;--soft:#d6c19b;--acc:#e8c674;--cu:#a8432a;--btn:linear-gradient(#f0d488,#c4953f 55%,#8a6424);--line:#6e4f1e}

*{box-sizing:border-box;min-width:0}

#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}

#story{margin:0 0 6px;color:var(--soft);font-size:15px}
#task{margin:0;font-weight:700;font-size:15px}

button:disabled{opacity:.4;cursor:default}
#tour{background:linear-gradient(#d0714e,#a8432a 55%,#6e2a18);color:#fbe9c8;border-color:#4a1c10}
#pg{min-width:4.5em;text-align:center;font:17px "ZCOOL QingKe HuangYou",serif;white-space:nowrap}
#toast{position:fixed;left:50%;top:24%;transform:translate(-50%,-10px);background:linear-gradient(#d0714e,#a8432a);border:2px solid #e8c674;color:#fbe9c8;font:22px "ZCOOL QingKe HuangYou",serif;padding:12px 22px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:#e8c674;font:24px "ZCOOL QingKe HuangYou",serif;transition:opacity .6s;text-align:center;padding:20px}
@media(max-width:600px){.hud{top:8px;left:8px;width:calc(100% - 16px);padding:10px 14px 12px}h1{font-size:24px}#story,#task{font-size:13px}button{padding:0 13px;font-size:15px}#pg{display:none}}
@media(max-height:720px){#story{display:none}.hud{padding:10px 14px 12px}h1{font-size:24px;margin-bottom:2px}#task{font-size:13px}}
@media(prefers-reduced-motion:reduce){#toast,#load{transition:none}}
</style>
</head>

  function collect(G){G.popT=tNow;done[G.k]=1;save();chime();heroes.forEach(h=>{if(h.k===G.k)h.jump=tNow});['f1','f'+(G.k+1),'f7'].forEach(redraw);const n=cnt();toast(n===5?'五枚印章集齐了！翻到尾声看看':`盖章！第 ${G.k} 站 · ${CH[G.k].n}`);updateUI()}
  $('#next').onclick=()=>{ac();stopTour();next()};$('#prev').onclick=()=>{ac();stopTour();prev()};
  $('#tour').onclick=()=>{ac();if(touring){stopTour();return}touring=true;$('#tour').textContent='停止翻页';if(cur()>=6){leaves.forEach(L=>L.target=0);updateUI();tourT=tNow}else tourT=tNow-3.4};
  addEventListener('keydown',e=>{if(e.key==='ArrowRight'){ac();stopTour();next()}else if(e.key==='ArrowLeft'){ac();stopTour();prev()}});
  // 拖拽翻页 + 点击齿轮
  const ray=new THREE.Raycaster(),m2=new THREE.Vector2();
  const setRay=e=>{const r=cv.getBoundingClientRect();m2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(m2,cam)};
  const onPlane=()=>{const o=ray.ray.origin,d=ray.ray.direction;if(Math.abs(d.y)<1e-5)return null;const t=-o.y/d.y;return{x:o.x+d.x*t,z:o.z+d.z*t}};
  const hitGear=()=>{const list=gears.filter(G=>!G.gone&&G.popT<0&&OPEN[G.k]>.7).map(G=>G.mesh);if(!list.length)return null;const h=ray.intersectObjects(list,false)[0];return h?gears.find(G=>G.mesh===h.object):null};
  let D=null;
  cv.addEventListener('pointerdown',e=>{ac();setRay(e);const p=onPlane();D={x0:e.clientX,y0:e.clientY,moved:false,L:null,fw:true,pt:0,vel:0,ts:performance.now()};if(p&&Math.abs(p.z)<H/2+.15&&Math.abs(p.x)<W+.15){const c=cur();if(p.x>0&&c+1<N){D.L=leaves[c+1];D.fw=true}else if(p.x<=0&&c>=0){D.L=leaves[c];D.fw=false}}if(D.L)D.pt=D.L.th;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{setRay(e);if(!D){cv.style.cursor=hitGear()?'pointer':'grab';return}if(!D.moved&&D.L&&Math.hypot(e.clientX-D.x0,e.clientY-D.y0)>6){D.moved=true;D.L.drag=true;stopTour();cv.style.cursor='grabbing'}if(D.moved){const p=onPlane();if(p){const th=Math.acos(clamp(p.x/W,-1,1)),now=performance.now(),dt=Math.max(1,now-D.ts)/1000;D.vel=D.vel*.6+((th-D.pt)/dt)*.4;D.pt=th;D.ts=now;D.L.target=th}}});
  const endDrag=e=>{if(!D)return;if(D.moved){const L=D.L,th=L.target,v=D.vel;L.drag=false;const left=D.fw?(v>2||(v>-2&&th>PI*.3)):!(v<-2||(v<2&&th<PI*.7));L.target=left?PI:0;if(left===D.fw)flipSnd();updateUI()}else if(e.type==='pointerup'){setRay(e);const G=hitGear();if(G)collect(G)}D=null;cv.style.cursor='grab'};
  cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
  // 镜头
  const camDir=new THREE.Vector3(0,.86,.52).normalize();let camD=4;
  function fit(){const a=innerWidth/Math.max(1,innerHeight);cam.aspect=a;const tv=Math.tan(cam.fov*PI/360);camD=Math.max(1.0/tv,1.42/(tv*a));cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)}
  addEventListener('resize',fit);fit();updateUI();
  let last=performance.now();
  function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;tNow=t;
    leaves.forEach((L,i)=>{const sp=L.drag?20:RM?14:5.2;L.th+=(L.target-L.th)*(1-Math.exp(-dt*sp));const v=(L.th-L.pth)/Math.max(dt,1e-4);L.pth=L.th;const b=RM?0:clamp(v*.035,-.13,.13)*Math.sin(L.th);L.bend+=(b-L.bend)*Math.min(1,dt*10);if(Math.abs(L.bend-L.lb)>2e-4){L.lb=L.bend;bendLeaf(L)}L.g.rotation.z=L.th;L.g.position.y=L.th<PI/2?TH*(N-1-i):TH*i});
    const nr=leaves.filter(L=>L.th<PI/2).length,nl=N-nr;[[stacks[0],nr],[stacks[1],nl]].forEach(([m,n])=>{const hh=TH*Math.max(0,n-1);m.visible=hh>0;m.scale.y=Math.max(hh,1e-4);m.position.y=hh/2-.0008});
    for(let k=0;k<7;k++){const o=clamp((leaves[k].th-leaves[k+1].th)/PI,0,1);OPEN[k]=o;spreads[k].forEach(p=>{const s=sm(clamp((o-.12-p.d)/(.88-p.d),0,1));p.pv.visible=s>.003;p.pv.rotation.x=p.dir*(1-s)*PI/2})}
    heroes.forEach(h=>{const o=OPEN[h.k];let walk=false;if(!h.stat){if(o<.05)h.hx=.9;else if(o>.8&&h.hx>h.x1){h.hx=Math.max(h.x1,h.hx-dt*.22);walk=true}}h.pv.position.x=h.hx;let y=0,rz=0,sy=1;if(walk&&!RM){y=Math.abs(Math.sin(t*9))*.018;rz=Math.sin(t*9)*.07}else sy=1+Math.sin(t*2.4)*.012;if(h.cheer&&!RM)y=Math.max(0,Math.sin(t*4))*.05;const jt=t-h.jump;if(jt<1.2)y+=Math.abs(Math.sin(jt*PI*1.7))*.09*(1-jt/1.2);h.mesh.position.y=y;h.mesh.rotation.z=rz;h.mesh.scale.y=sy;h.mesh.material.map=(h.cheer||jt<1.2)?h.tx.cheer:walk&&(t*4|0)%2?h.tx.walk:h.tx.stand});
    gears.forEach(G=>{if(G.gone)return;G.mesh.rotation.z=t*.8;if(G.popT<0){G.mesh.position.y=G.h+Math.sin(t*2+G.k)*.012;return}const e=(t-G.popT)/.7;G.mesh.scale.setScalar(1+e*.9);G.mesh.material.opacity=Math.max(0,1-e);G.mesh.rotation.z=t*.8+e*6;G.st.scale.y=Math.max(.001,1-e);if(e>=1){G.gone=true;G.mesh.visible=G.st.visible=false}});
    const all=cnt()===5;towers.forEach(T=>{const run=T.end?all:(T.k>=1&&T.k<=5&&done[T.k]);if(run){T.hands[0].rotation.z-=dt*1.6;T.hands[1].rotation.z-=dt*1.6/12}});
    if(!RM){wob.forEach(w=>w.mesh.rotation.z=Math.sin(t*1.4+w.ph)*.035);flick.forEach(f=>{f.mesh.scale.y=1+Math.sin(t*10+f.ph)*.07+Math.sin(t*17+f.ph)*.04;f.mesh.scale.x=1-Math.sin(t*10+f.ph)*.03})}
    if(touring&&t>tourT+4.2){tourT=t;if(cur()<6)next();else stopTour()}
    const c=cur(),wide=cam.aspect>1.45,tx=(c<0?.5:c>=N-1?-.5:0)-(wide?.27:0);camX+=(tx-camX)*(1-Math.exp(-dt*3));const dd=camD*(c<0||c>=N-1?.82:1)*(wide?1.08:1);cam.position.set(camX,0,.04).addScaledVector(camDir,dd);cam.lookAt(camX,.1,-.1);
    renderer.render(scene,cam);requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  const ld=$('#load');ld.style.opacity=0;setTimeout(()=>ld.remove(),700);
}
main().catch(e=>{const l=$('#load');if(l)l.textContent='出了点问题：'+e.message});
}
</script>
